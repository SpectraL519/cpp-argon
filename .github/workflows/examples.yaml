name: CPP-ARGON Examples
on:
  push:
    branches:
      - "*"
    paths:
      - .github/workflows/examples.yaml
      - include/**
      - examples/**
      - CMakeLists.txt
      - MODULE.bazel
      - BUILD.bazel
  pull_request:
    branches:
      - master

jobs:
  build-examples-linux:
    name: Build cpp-argon-examples (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out current branch
        uses: actions/checkout@v4

      - name: Build cpp-argon-examples (CMake)
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -B build -DBUILD_EXAMPLES=ON -DCMAKE_CXX_COMPILER=$CXX -DCMAKE_C_COMPILER=$CC
          cmake --build build/ -j 4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build cpp-argon-examples (Bazel)
        run: |
          bazel build //examples:all_examples

  build-examples-windows:
    name: Build cpp-argon-examples (Windows)
    runs-on: windows-2022

    steps:
      - name: Check out current branch
        uses: actions/checkout@v4

      - name: Build cpp-argon-examples (CMake)
        run: |
          cmake -B build -DBUILD_EXAMPLES=ON
          cmake --build build/ --config Release -j 4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build cpp-argon-examples (Bazel)
        run: |
          bazel build //examples:all_examples
